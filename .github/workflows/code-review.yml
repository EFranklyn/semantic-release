name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install # Instala todas as dependências necessárias

      - name: Instalar ReviewDog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin

      - name: Executar análise com ReviewDog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
        run: |
          npx eslint . | reviewdog -f=eslint -reporter=github-pr-review
